server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;

  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # Everything is served from this origin. Inline styles are allowed because the charts and
  # progress bars set styles on elements; scripts stay restricted to this origin.
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'" always;

  # The browser only talks to this origin; API calls are forwarded to the backend service.
  # A variable plus a resolver makes nginx look the name up per request, so it still starts
  # if the backend is not up yet.
  location /api/ {
    resolver 127.0.0.11 valid=10s;
    set $backend http://backend:8080;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 30s;
    # The backend sends these too; keep only nginx's copy so they are not repeated.
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-Frame-Options;
  }

  # Hashed build assets never change, so browsers may cache them for a long time.
  # (`expires` is used instead of `add_header` on purpose: an add_header inside a location block
  # silently drops every add_header inherited from the server block, i.e. the security headers.)
  location /assets/ {
    expires 1y;
    try_files $uri =404;
  }

  # Single-page app: any other path serves index.html and the router takes over.
  location / {
    expires -1;
    try_files $uri /index.html;
  }
}
