spring:
  application:
    name: fintrack-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fintrack}
    username: ${DB_USERNAME:fintrack}
    # No default: supply DB_PASSWORD through the environment (see .env.example).
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
    open-in-view: false
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  autoconfigure:
    exclude:
      # Users live in our own table; this stops Spring creating a default in-memory
      # user with a generated password that is printed to the log.
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # No default: generate one, e.g. `openssl rand -base64 48`, and set JWT_SECRET.
    secret: ${JWT_SECRET:}
    expiration: PT1H

management:
  endpoints:
    web:
      exposure:
        include: health
