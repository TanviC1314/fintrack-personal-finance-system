spring:
  application:
    name: fintrack-backend
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/fintrack}
    username: ${DB_USERNAME:fintrack}
    # No default: supply DB_PASSWORD through the environment (see .env.example).
    password: ${DB_PASSWORD:}
  jpa:
    hibernate:
      # Flyway owns the schema; Hibernate only checks that entities match it.
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration

app:
  jwt:
    # No default: generate one, e.g. `openssl rand -base64 48`, and set JWT_SECRET.
    secret: ${JWT_SECRET:}
    expiration: PT1H

management:
  endpoints:
    web:
      exposure:
        include: health
